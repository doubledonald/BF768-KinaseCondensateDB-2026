<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CondensateDB Login</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="x-build-tag" content="login-fancy-v2">
    <link rel="stylesheet" href="/static/css/style.css?v=login-fancy-v2">
    <style>
      .condensate-auth-bg{
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:0;
        opacity:.62;
        filter:blur(.2px);
        background:
          radial-gradient(circle at 12% 20%, rgba(14,165,233,.18) 0, rgba(14,165,233,.04) 24%, transparent 52%),
          radial-gradient(circle at 82% 16%, rgba(37,99,235,.16) 0, rgba(37,99,235,.06) 26%, transparent 54%),
          radial-gradient(circle at 46% 72%, rgba(96,165,250,.16) 0, rgba(96,165,250,.04) 24%, transparent 56%);
      }
      .condensate-auth-orbit,.condensate-auth-node{
        position:absolute;
        border-radius:50%;
        opacity:.48;
      }
      .condensate-auth-orbit{
        border:2px solid rgba(14,165,233,.35);
        box-shadow:0 0 36px rgba(14,165,233,.22);
        background:radial-gradient(circle, rgba(255,255,255,.14), transparent 64%);
      }
      .orbit-a{ width:280px;height:280px;top:-60px;left:-80px; }
      .orbit-b{ width:360px;height:360px;top:20vh;right:-120px;transform:rotate(24deg); }
      .orbit-c{ width:210px;height:210px;bottom:16vh;left:18vw;transform:rotate(-20deg); }
      .condensate-auth-node{
        width:12px;height:12px;background:var(--primary);
        box-shadow:0 0 18px rgba(37,99,235,.42), 0 0 0 7px rgba(37,99,235,.12);
      }
      .node-a{ left:29%;top:26%; }
      .node-b{ left:57%;top:42%; }
      .node-c{ left:67%;top:64%; }
      .condensate-auth-orbit::before,
      .condensate-auth-orbit::after{
        content:"";
        position:absolute;
        width:46px;height:2px;
        background:linear-gradient(90deg, rgba(30,64,175,0), rgba(30,64,175,.65), rgba(30,64,175,0));
        top:50%;left:12%;
      }
      .condensate-auth-orbit::before{transform:translateY(-50%) rotate(22deg);}
      .condensate-auth-orbit::after{transform:translateY(-50%) rotate(-20deg);left:auto;right:12%;}
    </style>
  </head>
  <body class="auth-body">
    <div class="condensate-auth-bg" aria-hidden="true">
      <span class="condensate-auth-orbit orbit-a"></span>
      <span class="condensate-auth-orbit orbit-b"></span>
      <span class="condensate-auth-orbit orbit-c"></span>
      <span class="condensate-auth-node node-a"></span>
      <span class="condensate-auth-node node-b"></span>
      <span class="condensate-auth-node node-c"></span>
    </div>

    <div class="auth-left">
      <h1>CondensateDB</h1>
      <p>
        An integrated query and management platform for biomolecular condensates, proteins,
        kinases, diseases, chemical modifiers, and literature evidence.
      </p>
      <p class="course-credit">This project was developed at Boston University as part of BF768, Spring 2026, G. Benson instructor.</p>
    </div>

    <div class="auth-card">
      <h2>Sign In</h2>
      <div class="form-row">
        <label>Username</label>
        <input id="username" class="input">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input id="password" type="password" class="input">
      </div>
      <label>Role</label>
      <div class="radio">
        <label>
          <input type="radio" name="role" value="User" checked> User
        </label>
        <label>
          <input type="radio" name="role" value="Administrator"> Administrator
        </label>
      </div>
      <button class="btn primary" onclick="login()">Sign In</button>
      <button class="btn" onclick="location.href='/register'">Register</button>
      <button class="btn" onclick="location.href='/static/help.html?from=home'">Help</button>
    </div>

    <script>
      async function login(){
        const username=document.getElementById('username').value.trim(),
          password=document.getElementById('password').value.trim(),
          roleLabel=document.querySelector("input[name=role]:checked")?.value,
          role=roleLabel==="Administrator"?"admin":"user";

        if(!username||!password||!role){
          alert('Username, password and role are required');
          return
        }

        const r=await fetch('/api/auth/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({username,password,role})
        });

        const j=await r.json();
        if(j.code!==200){
          alert(j.msg);
          return
        }

        localStorage.setItem('token',j.data.token);
        localStorage.setItem('user',JSON.stringify(j.data.user));
        location.href=role==='admin'?'/admin':'/index'
      }
    </script>
  </body>
</html>
