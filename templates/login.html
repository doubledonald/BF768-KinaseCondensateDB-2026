<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>CondensateDB Login</title><link rel="stylesheet" href="./static/css/style.css"></head><body class="auth-body">
<div class="auth-left"><h1>CondensateDB</h1><p>An integrated query and management platform for biomolecular condensates, proteins, kinases, diseases, chemical modifiers, and literature evidence.</p><p>All standard users can register and use the public portal directly.</p></div>
<div class="auth-card"><h2>Sign In</h2><div class="form-row"><label>Username</label><input id="username" class="input"></div><div class="form-row"><label>Password</label><input id="password" type="password" class="input"></div><button class="btn primary" onclick="login('user')">Sign In</button> <button class="btn" onclick="login('admin')">Administrator Sign In</button> <button class="btn" onclick="location.href='register'">Register</button></div>
<script>
async function login(role='user'){const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value.trim();if(!username||!password){alert('Username and password are required');return}const payload={username,password,role};if(role==='admin'){payload.role='admin'}const r=await fetch('api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(j.code!==200){alert(j.msg);return}localStorage.setItem('token',j.data.token);localStorage.setItem('user',JSON.stringify(j.data.user));location.href=role==='admin'?'admin':'index'}
</script></body></html>
